<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" type="text/css" href="css\admin-header.css">
    <link rel="stylesheet" type="text/css" href="css\admin-pedidos.css">

    <title>Pedidos - Admin</title>

</head>

<body>
    <!-- Header de navegação -->
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo">
                <img src="img/if-logo.png" alt="Logo IF">
                <p>CANTINA - ADMIN</p>
            </div>

            <!-- Opcional: só coloque quando quiser -->
            <a id="btnVoltar" href="admin-home.html">VOLTAR</a>
        </div>
    </nav>

    <!-- Filtro -->
    <aside>
        <button id="btnAbrirFiltros" class="botaoFiltro">Filtros</button>
        <div id="popupFiltros" class="popup" style="display: none;">
    <div class="popup-content">
        <span class="popup-fechar">&times;</span>
        <h4>Filtrar Pedidos</h4>
        <div class="filtro-group">
            <label>Forma de Pagamento:</label>
            <select id="filtroFormaPagamento">
                <option value="">Todos</option>
                <option value="PIX">PIX</option>
                <option value="DINHEIRO">Dinheiro</option>
                <option value="FIADO">Fiado</option>
            </select>
        </div>
        <div class="filtro-group">
            <label>Status do Pagamento:</label>
            <select id="filtroStatusPagamento">
                <option value="">Todos</option>
                <option value="PENDENTE">Pendente</option>
                <option value="PAGO">Pago</option>
            </select>
        </div>
        <div class="filtro-group">
            <label>Status do Pedido:</label>
            <select id="filtroStatusPedido">
                <option value="">Todos</option>
                <option value="AGUARDANDO">Aguardando</option>
                <option value="PRONTO">Pronto</option>
                <option value="RETIRADO">Retirado</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
        </div>
        <button id="btnFiltrar">Aplicar Filtros</button>
        <button id="btnLimparFiltros">Limpar Filtros</button>
    </div>
</div>
    </aside>

    <aside id="asideTable">
        <table class="table table-hover table-custom" border="1">
            <thead>
                <tr>
                    <th>Nº Pedido</th>
                    <th>Nome</th>
                    <th>Valor total</th>
                    <th style="min-width: 120px;">Itens</th>
                    <th>Observações</th>
                    <th>Forma de Pagamento</th>
                    <th>Status do pagamento</th>
                    <th>Status do pedido</th>
                </tr>
            </thead>

            <tbody id="bodyTabela">

            </tbody>
        </table>
    </aside>

    <footer>

    </footer>

    <script src="js\admin-pedidos.js"></script>
</body>

</html>
