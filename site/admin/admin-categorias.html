<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" type="text/css" href="css\admin-header.css">
    <link rel="stylesheet" type="text/css" href="css\admin-categorias.css">

    <title>Categorias - Admin</title>

</head>

<body>
    <!-- Header de navegação -->
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo">
                <img src="img/if-logo.png" alt="Logo IF">
                <p>CANTINA - ADMIN</p>
            </div>

            <!-- Opcional: só coloque quando quiser -->
            <a id="btnVoltar" href="admin-home.html">VOLTAR</a>
        </div>
    </nav>

    <aside>
        <button class="botaoCadastrar" onclick="Cadastrar()">Cadastrar categoria</button>
    </aside>
    <!-- Tabela de categorias -->
    <aside id="asideTable">
        <table class="table table-hover table-custom" border="1">
            <thead>
                <tr>
                    <th>Nome da categoria</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="bodyTabela">

            </tbody>
        </table>
    </aside>
    <!-- Popup de verificação e visualização -->
    <div id="popupVerificar" class="popup">
        <div class="popup-content">
            <a href="#" class="fechar">&times;</a>

            <form action="" method="GET" class="formsPopup formsPopup--v2">
                <p id="tituloVerificar" class="centalizadoForms titulo-modal">Título</p>
                <input type="number" id="idVisualizado" hidden>

                <div class="grid-form">
                    <div class="campo">
                        <label for="nome">Nome da categoria</label>
                        <input type="text" id="nome" maxlength="50">
                    </div>
                    
                    <div class="campo">
                        <label for="disponibilidade">Disponibilidade</label>
                        <select id="disponibilidade">
                            <option value="1">Ativo</option>
                            <option value="0">Inativo</option>
                        </select>
                    </div>

                    <div class="acoes-form">
                        <button id="salvarVerificacao" onclick="Salvar()">Salvar</button>
                    </div>
                </div>

            </form>
        </div>
    </div>
    <!-- Popup de visualização -->
    <div id="popupVisualizar" class="popup">
        <div class="popup-content">
            <a href="#" class="fechar">&times;</a>
            <div class="visualizadorPopup">
                <p id="tituloVisualizar" class="centalizadoForms">Título</p>
                <div style="flex: 66%; display: flex; flex-wrap: wrap;">
                    <div class="containerForms">
                        <label>Nome do produro</label>
                        <p id="labelNome"></p>
                    </div>
                </div>

                <div style="flex: 33%;">
                    <div class="containerForms">
                        <label>Disponibilidade</label>
                        <p id="labelDisponibilidade"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>

    </footer>

    <script src="js\admin-categorias.js"></script>
</body>

</html>
