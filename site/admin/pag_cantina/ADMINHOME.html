<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF - Cantina Admin</title>

    <style>
        @import url(ADMINHEADER.css);


        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 600px);
            gap: 30px;
            justify-content: center;

            align-content: center;

            min-height: calc(100vh - 10vh);


        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #004206;

        }


        .ofertas {
            height: 260px;
            background: black;
            border-radius: 10px;
            border: 2px solid #004206;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .card-btn {
            background: #004206;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .card-btn:hover {

            background: #006b0a;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="navdiv">

            <div class="logo">

                <img src="https://ifrs.edu.br/vacaria/wp-content/themes/ifrs-portal-theme/favicons/favicon-194x194.png"
                    alt="Logo IF">

                <p>CANTINA - ADMIN</p>
            </div>

        </div>

    </nav>

    <main class="dashboard">

        <div class="card">
            <img src="produtos.png" alt="Produtos">
            <button id="btnProdutos" class="card-btn">PRODUTOS</button>
        </div>

        <div class="card">
            <img src="pedidos.png" alt="Pedidos">
            <button id="btnPedidos" class="card-btn">PEDIDOS</button>
        </div>

        <div class="card">
            <img src="promocoes.png" alt="Promoções">
            <button id="btnPromocoes" class="card-btn">PROMOÇÕES</button>
        </div>

    </main>


    <script>

  document.getElementById("btnProdutos").addEventListener("click", () => { window.location.href = "pag_cantina.html";});

  document.getElementById("btnPedidos").addEventListener("click", () => { window.location.href = "pedidos.html";});

  document.getElementById("btnPromocoes").addEventListener("click", () => { window.location.href = "promocoes.html";});





    </script>

</body>

</html>
