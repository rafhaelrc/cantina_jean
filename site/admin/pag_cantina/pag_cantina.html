<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" type="text/css" href="../ADMINHEADER.css">
    <link rel="stylesheet" type="text/css" href="pag_cantina.css">
    
    <title>Produtos - Admin</title>

</head>
<body>
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo">
                <a href="#"><img src="https://ifrs.edu.br/vacaria/wp-content/themes/ifrs-portal-theme/favicons/favicon-194x194.png"
                    alt="Logo IF"></a>
                <a href="#">CANTINA - ADMIN</a>
            </div>
        </div>
    </nav>

    <aside>
        <a href="#popupVerificar"><button class="botaoCadastrar" onclick="Cadastrar()">Cadastrar produto</button></a>
    </aside>

    <aside id="asideTable">
        <table class="table table-hover table-custom" border="1">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody  id="bodyTabela">
                
            </tbody>
        </table>
    </aside>

    <div id="popupVerificar" class="popup">
    <div class="popup-content">
        <a href="#" class="fechar">&times;</a>
        <p>Verificar - Criar e Editar</p>
        <form action="" method="GET" class="formsPopup">
            <p id="titulo" class="centalizadoForms">Título</p>
            <div style="flex: 66%; display: flex; flex-wrap: wrap;">
                <div class="containerForms">
                    <label for="nome">Nome do produro</label>
                    <input type="text" id="nome" maxlength="30">
                </div>

                <div class="containerForms">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" maxlength="20">
                </div>

                <div class="containerForms">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao">
                </div>
                
                <div class="containerForms">
                    <input type="checkbox" id="disponibilidade">
                    <label for="disponibilidade">Disponivel</label>
                </div>

                <div class="containerForms">
                    <label for="enviarFoto" class="labelFoto">Foto do produto</label>
                    <input type="file" id="enviarFoto" hidden>
                </div>
            </div>

            <div style="flex: 33%;">
                <div class="containerForms">
                    <label for="preco">Preço</label>
                    <input type="number" id="preco">
                </div>

                <div class="containerForms">
                    <label for="foto">Vizualização da foto</label>
                    <img src="Lapis.svg" width="200px">
                </div>
            </div>
            
            <div class="centalizadoForms">
                <input type="submit" value="Salvar">
            </div>

        </form>
    </div>
    </div>

    <div id="popupVisualizar" class="popup">
    <div class="popup-content">
        <a href="#" class="fechar">&times;</a>
        <p>Vizualizar</p>
    </div>
    </div>


    <footer>
        
    </footer>

    <script src="pag_cantina.js"></script>
</body>
</html>
