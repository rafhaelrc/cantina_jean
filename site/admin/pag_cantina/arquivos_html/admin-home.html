<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF - Cantina Admin</title>
    <!-- CSS externo do header -->
    <link rel="stylesheet" type="text/css" href="..\arquivos_css\admin-header.css">
    <link rel="stylesheet" type="text/css" href="..\arquivos_css\admin-home.css">

</head>

<body>
    <!--Header de navegação-->
    <nav class="navbar">

        <div class="navdiv">

            <div class="logo">

                <img src="..\imgs\if_logo.png" alt="Logo IF">

                <p>CANTINA - ADMIN</p>
            </div>

        </div>

    </nav>
    <!-- Área principal do dashboard -->
    <main class="dashboard">

        <div class="card">
            <img src="..\imgs\admin-produtos.jpg" alt="Produtos">
            <button id="btnProdutos" class="card-btn">PRODUTOS</button>
        </div>

        <div class="card">
            <img src="..\imgs\admin-pedidos.png" alt="Pedidos">
            <button id="btnPedidos" class="card-btn">PEDIDOS</button>
        </div>

        <div class="card">
            <img src="..\imgs\admin-promocoes.png" alt="Promoções">
            <button id="btnPromocoes" class="card-btn">PROMOÇÕES</button>
        </div>

        <div class="card">
            <img src="..\imgs\admin-categorias.png" alt="Categorias">
            <button id="btnCategorias" class="card-btn">CATEGORIAS</button>
        </div>

    </main>


    <script src="..\arquivos_js\admin-home.js"></script>

</body>

</html>
