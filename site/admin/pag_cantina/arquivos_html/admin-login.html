<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF CANTINA ADMIN - LOGIN</title>
    <!-- CSS externo do header -->
    <link rel="stylesheet" type="text/css" href="..\arquivos_css\admin-header.css">
    <link rel="stylesheet" type="text/css" href="..\arquivos_css\admin-login.css">
</head>

<body>
    <!-- Header de navegação -->
    <nav class="navbar">

        <div class="navdiv">

            <div class="logo">

                <img src="..\imgs\if_logo.png" alt="Logo IF">

                <p>CANTINA - ADMIN</p>
            </div>

        </div>

    </nav>
    <!-- Área principal do login -->
    <main class="login-wrapper">
        <div class="login-box">
            <form action="">
                <h2>Logar como Administrador</h2>
                <!-- Campos de usuário e senha -->
                <input type="text" placeholder="Digite seu Usuário" required id="usuario">
                <input type="password" placeholder="Digite sua Senha" required id="senha">
                <input type="submit" onclick="logar()">

            </form>
        </div>
    </main>
    </div>
</body>
<script src="..\arquivos_js\admin-login.js"></script>
</html>
