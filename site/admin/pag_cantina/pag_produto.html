<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" type="text/css" href="arquivos_css/ADMINHEADER.css">
    <link rel="stylesheet" type="text/css" href="arquivos_css/pags_cadastros.css">

    <title>Produtos - Admin</title>

</head>

<body>
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo">
                <a href="#"><img
                        src="https://ifrs.edu.br/vacaria/wp-content/themes/ifrs-portal-theme/favicons/favicon-194x194.png"
                        alt="Logo IF"></a>
                <p>CANTINA - ADMIN</p>
                <div>
                    <a href="ADMINHOME.html" id="btnVoltar">Voltar</a>

                </div>
            </div>
        </div>
    </nav>

    <aside>
        <button class="botaoCadastrar" onclick="Cadastrar()">Cadastrar produto</button>
    </aside>

    <aside id="asideTable">
        <table class="table table-hover table-custom" border="1">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="bodyTabela">

            </tbody>
        </table>
    </aside>

    <div id="popupVerificar" class="popup">
        <div class="popup-content">
            <a href="#" class="fechar">&times;</a>
            <form action="" method="GET" class="formsPopup">
                <p id="tituloVerificar" class="centalizadoForms">Título</p>
                <input type="number" id="idVisualizado" hidden>
                <div style="flex: 66%; display: flex; flex-wrap: wrap;">
                    <div class="containerForms">
                        <label for="nome">Nome do produto</label>
                        <input type="text" id="nome" maxlength="30">
                    </div>

                    <div class="containerForms">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" maxlength="60">
                    </div>

                    <div class="containerForms">
                        <label for="disponibilidade">Disponibilidade</label><br>
                        <select id="disponibilidade">
                            <option value="1">Ativo</option>
                            <option value="0">Inativo</option>
                        </select>
                    </div>

                    <div class="containerForms">
                        <label for="categoria">Categoria</label><br>
                        <select id="categoria">
                            <option value="-1">Selecione</option>

                        </select>
                    </div>
                </div>

                <div style="flex: 33%;">
                    <div class="containerForms">
                        <label for="preco">Preço</label>
                        <input type="number" id="preco">
                    </div>

                    <div class="containerForms">
                        <label for="enviarFoto" id="labelImgCadastrada">
                            Vizualização da foto<br>
                            <img src="imgs/fotoPadraoProduto.svg" width="200px" id="imgCadastrada"><br>
                            Clique para alterar
                        </label>
                        <input type="file" id="enviarFoto" accept="image/*" hidden>
                    </div>
                </div>
                <div class="centalizadoForms">
                    <button class="salvarVerificacao" onclick="Salvar()">Salvar</button>
                </div>

            </form>
        </div>
    </div>

    <div id="popupVisualizar" class="popup">
        <div class="popup-content">
            <a href="#" class="fechar">&times;</a>
            <div class="visualizadorPopup">
                <p id="tituloVisualizar" class="centalizadoForms">Título</p>
                <div style="flex: 66%; display: flex; flex-wrap: wrap;">
                    <div class="containerForms">
                        <label>Nome do produro</label>
                        <p id="labelNome"></p>
                    </div>

                    <div class="containerForms">
                        <label>Categoria</label>
                        <p id="labelCategoria"></p>
                    </div>

                    <div class="containerForms">
                        <label>Descrição</label>
                        <p id="labelDescricao"></p>
                    </div>

                    <div class="containerForms">
                        <label>Disponibilidade</label>
                        <p id="labelDisponibilidade"></p>
                    </div>
                </div>

                <div style="flex: 33%;">
                    <div class="containerForms">
                        <label>Preço</label>
                        <p id="labelPreco"></p>
                    </div>

                    <div class="containerForms">
                        <label>Vizualização da foto
                            <img src="imgs/fotoPadraoProduto.svg" id="visualizarImgCadastrada">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>

    </footer>

    <script src="arquivos_js/pag_produto.js"></script>
</body>

</html>
