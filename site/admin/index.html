<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF CANTINA ADMIN - LOGIN</title>
    <!-- CSS externo do header -->
    <link rel="stylesheet" type="text/css" href="css/admin-header.css">
    <link rel="stylesheet" type="text/css" href="css/admin-login.css">
</head>

<body>
 <body>
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo">
                <img src="img/if-logo.png" alt="Logo IF">
                <p>CANTINA - ADMIN</p>
            </div>
        </div>
    </nav>

    <main class="login-wrapper">
        <div class="login-box">
            <form onsubmit="event.preventDefault(); logar();">
                <h2>Logar como Administrador</h2>
                
                <input type="text" placeholder="Digite seu Usuário" required id="usuario">
                <input type="password" placeholder="Digite sua Senha" required id="senha">
                
                <button type="submit" id="btnEntrar">ENTRAR</button>
            </form>
        </div>
    </main>

    <script src="js/admin-login.js"></script>
</body>
</html>
