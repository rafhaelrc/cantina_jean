<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantina Jean</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOPO VERDE (LOGO / PESQUISA / CARRINHO) -->
  <header class="header-verde">
    <div class="container header-verde-content">

      <div class="logo-faculdade">
        <img src="if_logo.png" alt="Logo IF">
      </div>

      <input
        class="pesquisa"
        type="text"
        placeholder="Pesquisar produto"
      >

      <div class="carrinho">🛒</div>

    </div>
  </header>

  <!-- LINHA NORMAL (SEM ESPAÇO) -->
  <hr class="linha-topo">

  <!-- BOTÕES (FORA DO HEADER, MAS VERDES) -->
  <nav class="nav-botoes">
    <button><strong>Início</strong></button>
    <button><strong>Cardápio</strong></button>
    <button><strong>Pedido</strong></button>
    <button style="color: rgb(231, 231, 79);"><strong>Fale Conosco</strong></button>
  </nav>



<div class="conteudo-principal container">

  <!--Quadro de avisos do Jean-->

  


  <!--Ofertas-->

  <section class="ofertas">
  <h2 class="titulo-ofertas">Ofertas</h2>

  <div class="carrossel">
    <button class="seta esquerda">&#10094;</button>

    <div class="carrossel-track">
      <div class="item">Coca 600ml</div>
      <div class="item">Brigadeiro</div>
      <div class="item">Pastel</div>
      <div class="item">Café</div>
    </div>


    <button class="seta direita">&#10095;</button>
  </div>
  
    </section>

    <section class="aviso">
    <p>Irei chegar somente às <strong>15 horas</strong></p>
  </section>



</div>

  <script src="script.js"></script>
</body>
</html>
