<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF CANTINA ADMIN - LOGIN</title>
    <style>
        @import url(ADMINHEADER.css);

        .login-wrapper {
            height: calc(100vh - 70px);
            /* ajuste se o header ocupar espaço */
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
        }

        /* Caixa do login */
        .login-box {
            background: #e0e0e0;
            width: 460px;
            padding: 40px 35px;
            border-radius: 22px;
            border: 2px solid #000;
            text-align: center;
        }

        /* Título */
        .login-box h2 {
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: normal;
        }

        /* Inputs */
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 15px;

            border-radius: 20px;
            border: 2px solid #0b5e16;
            outline: none;
            font-size: 16px;
        }

        /* Botão */
        .login-box .entrar {
            width: 100%;
            padding: 14px;

            background: #0b5e16;
            color: #fff;
            font-size: 17px;
            font-weight: bold;

            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #084a11;
        }
    </style>


</head>

<body>

    <nav class="navbar">

        <div class="navdiv">

            <div class="logo">

                <img src="https://ifrs.edu.br/vacaria/wp-content/themes/ifrs-portal-theme/favicons/favicon-194x194.png"
                    alt="Logo IF">

                <a href="#">CANTINA - ADMIN</a>
            </div>

        </div>

    </nav>

    <main class="login-wrapper">
        <div class="login-box">
            <form action="">
                <h2>Logar como Administrador</h2>

                <input type="text" placeholder="Digite seu Usuário" required id="usuario">
                <input type="password" placeholder="Digite sua Senha" required id="senha">
                <input type="submit" onclick="logar()">

            </form>
        </div>
    </main>
    </div>
</body>
<script>

    function logar() {

        var usuario = document.getElementById('usuario').value;
        var senha = document.getElementById('senha').value;

        if (senha == "admin" && usuario == "admin") {
            alert('Sucesso');
        } else {
            alert('Usuário ou senha incorretos');
        }



    }





</script>

</html>
